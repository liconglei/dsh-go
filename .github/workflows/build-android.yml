# Release arm64 APK with the bundled engine, built entirely on GitHub runners.
# Not part of the PR gate: the runtime bundle is a long, network-heavy build.
#
#   gh workflow run build-android.yml --ref windows-remote-client
#
# One job, serially: build the pinned runtime bundle (mirrors runtime.yml),
# then call build-apk.sh, which enforces the bundle digests, builds
# libtawcroot.so with the pinned NDK 28.2.13676358 and checks the APK's JNI
# symbols and versionCode before it is uploaded.
name: Build Android arm64

on:
  workflow_dispatch:
  push:
    branches: [windows-remote-client]
    paths:
      - '.github/workflows/build-android.yml'
      - 'app/**'
      - 'runtime/**'
      - 'packages/**'
      - 'tooling/**'

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  GRADLE_VERSION: 9.3.1
  TAWCROOT_NDK: 28.2.13676358
  TZ: Asia/Shanghai

jobs:
  build:
    name: arm64 release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DSH_MAVEN_MIRRORS: 0 # Aliyun mirrors are slow/unreliable from a US runner (matches ci.yml).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # tawcroot pins NDK 28.2.13676358; the hosted image only ships 27/29/30.
      - name: Install the pinned NDK for tawcroot
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$TAWCROOT_NDK"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$TAWCROOT_NDK" >> "$GITHUB_ENV"

      # Downloads are verified by hash on every run, so a stale cache is harmless.
      - name: Restore the download cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: runtime-downloads-v1-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**') }}
          restore-keys: runtime-downloads-v1-
      - name: Build the arm64 runtime
        run: runtime/build-runtime.sh arm64-v8a
      - name: Check the bundle
        run: python3 -I tooling/check_runtime_bundle.py arm64
      - name: Save the download cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # CI pins Flutter 3.47.7; the lock was generated locally on 3.50 and
      # test_api 0.7.14 needs the newer Dart SDK. Let pub resolve the one
      # compatible downgrade instead of failing the whole build.
      - run: flutter pub get
        working-directory: app
      - name: Write local.properties
        working-directory: app
        run: printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
      # The signed release config is only created when key.properties exists.
      # Restore it from repository secrets so CI ships the same certificate as
      # local releases instead of falling back to the debug key.
      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for v in ANDROID_KEYSTORE_B64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n ${!v} ]] || { echo "::error::missing secret $v"; exit 1; }
          done
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > app/android/dsh-release.jks
          printf 'storeFile=../dsh-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > app/android/key.properties
          echo "restored keystore for alias $ANDROID_KEY_ALIAS"
      # build-apk.sh reads the build minute for versionCode and verifies the
      # bundle, tawcroot lib, JNI symbols and versionCode before finishing.
      - name: Build release APK
        run: bash tooling/build-apk.sh --flavor arm64 --release
      - name: Verify release signature
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/app/outputs/flutter-apk/app-arm64-release.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          [[ -n $signer ]] || { echo "::error::apksigner not found"; exit 1; }
          "$signer" verify --print-certs "$apk" | tee app/build/app/outputs/flutter-apk/signer.txt
          grep -q '01f725b29e343fd2ad0152de293d20fce12fc1b0593e6617348bfb2dd823379e' \
            app/build/app/outputs/flutter-apk/signer.txt
      - name: Collect and hash the APK
        shell: bash
        run: |
          apk=app/build/app/outputs/flutter-apk/app-arm64-release.apk
          sha256sum "$apk" | tee app/build/app/outputs/flutter-apk/sha256.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-android-arm64
          path: |
            app/build/app/outputs/flutter-apk/app-arm64-release.apk
            app/build/app/outputs/flutter-apk/sha256.txt
            app/build/app/outputs/flutter-apk/signer.txt
          if-no-files-found: error
          retention-days: 30
