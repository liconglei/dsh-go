# Windows desktop release packages for the remote-only client (main_desktop.dart).
# Not part of the PR gate: these are full builds that produce downloadable artifacts.
#
# x64 uses the stock flutter-action SDK. ARM64 uses the native windows-11-arm
# runner and bootstraps Flutter from source, because Flutter does not publish a
# Windows ARM64 SDK archive for flutter-action to download. No SDK patch is
# needed: on an ARM64 host Flutter selects the ARM64 target by itself.
name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [windows-remote-client]
    paths:
      - '.github/workflows/build-windows.yml'
      - 'app/**'
      - 'packages/**'
      - 'tooling/build-windows.sh'

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  TZ: Asia/Shanghai

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - name: Build x64
        working-directory: app
        run: flutter build windows --release -t lib/main_desktop.dart
      - name: Verify x64 architecture
        shell: pwsh
        working-directory: app
        run: |
          $exe = 'build/windows/x64/runner/Release/dsh_app.exe'
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $s = [IO.File]::OpenRead((Resolve-Path $exe)); $r = [IO.BinaryReader]::new($s)
          try {
            if ($r.ReadUInt16() -ne 0x5A4D) { throw 'not a PE file' }
            $s.Position = 60; $s.Position = $r.ReadInt32()
            if ($r.ReadUInt32() -ne 0x4550) { throw 'bad PE signature' }
            $machine = $r.ReadUInt16()
            if ($machine -ne 0x8664) { throw "expected x64 (0x8664), got 0x$('{0:X4}' -f $machine)" }
          } finally { $r.Dispose() }
          if (-not (Test-Path 'build/windows/x64/runner/Release/resources/app_icon.ico')) {
            throw 'branded app icon was not copied into the bundle'
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-windows-x64
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 30

  windows-arm64:
    name: Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # No ARM64 SDK archive exists for flutter-action, so check out the exact
      # Flutter source and let it bootstrap the native ARM64 Dart SDK itself.
      - name: Checkout Flutter SDK source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: flutter/flutter
          ref: ${{ env.FLUTTER_VERSION }}
          path: .build/flutter
          persist-credentials: false
      - name: Bootstrap native ARM64 Flutter
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'Arm64') {
            throw 'This job requires native ARM64 PowerShell.'
          }
          $flutterRoot = Join-Path $env:GITHUB_WORKSPACE '.build/flutter'
          "FLUTTER_ROOT=$flutterRoot" >> $env:GITHUB_ENV
          "$flutterRoot\bin" >> $env:GITHUB_PATH
          & "$flutterRoot\bin\flutter.bat" config --enable-windows-desktop
          if ($LASTEXITCODE -ne 0) { throw 'Flutter SDK bootstrap failed.' }
          $dart = & "$flutterRoot\bin\cache\dart-sdk\bin\dart.exe" --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $dart -notmatch 'windows_arm64') {
            throw "Expected a native ARM64 Dart SDK: $dart"
          }
          Write-Output $dart
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - name: Build ARM64
        working-directory: app
        shell: pwsh
        run: flutter build windows --release -t lib/main_desktop.dart
      - name: Verify ARM64 architecture
        shell: pwsh
        working-directory: app
        run: |
          $exe = 'build/windows/arm64/runner/Release/dsh_app.exe'
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          Get-ChildItem 'build/windows/arm64/runner/Release' -Recurse -File |
            Where-Object Extension -In @('.exe', '.dll') |
            ForEach-Object {
              $s = [IO.File]::OpenRead($_.FullName); $r = [IO.BinaryReader]::new($s)
              try {
                if ($r.ReadUInt16() -ne 0x5A4D) { throw "not a PE: $($_.FullName)" }
                $s.Position = 60; $s.Position = $r.ReadInt32()
                if ($r.ReadUInt32() -ne 0x4550) { throw "bad PE: $($_.FullName)" }
                $machine = $r.ReadUInt16()
                if ($machine -ne 0xAA64) {
                  throw "expected ARM64 (0xAA64), got 0x$('{0:X4}' -f $machine): $($_.FullName)"
                }
              } finally { $r.Dispose() }
            }
          $aot = [IO.File]::ReadAllBytes((Resolve-Path 'build/windows/arm64/runner/Release/data/app.so'))
          if ([BitConverter]::ToUInt32($aot, 0) -ne 0x464C457F -or $aot[4] -ne 2 -or $aot[5] -ne 1 -or
              [BitConverter]::ToUInt16($aot, 18) -ne 183) {
            throw 'expected an AArch64 ELF64 AOT snapshot: data/app.so'
          }
          if (-not (Test-Path 'build/windows/arm64/runner/Release/resources/app_icon.ico')) {
            throw 'branded app icon was not copied into the bundle'
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-windows-arm64
          path: app/build/windows/arm64/runner/Release/
          if-no-files-found: error
          retention-days: 30
